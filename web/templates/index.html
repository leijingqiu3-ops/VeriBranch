<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriBranch · 可审计的网点关停决策 Agent</title>
<style>
  :root {
    --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
    --bg: #f7f7f8; --card: #fff; --accent: #2563eb;
    --ok: #047857; --okbg: #ecfdf5; --bad: #b91c1c; --badbg: #fef2f2;
    --warn: #b45309; --warnbg: #fffbeb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.7 "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif; }
  header { padding: 22px 28px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
  h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .wrap { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px 28px 40px;
          max-width: 1240px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .left { padding: 16px; align-self: start; position: sticky; top: 16px; }
  label { font-size: 12px; color: var(--muted); }
  textarea { width: 100%; min-height: 84px; margin: 6px 0 10px; padding: 10px;
             border: 1px solid var(--line); border-radius: 8px; resize: vertical;
             font: inherit; color: inherit; background: #fff; }
  textarea:focus { outline: 2px solid #dbeafe; border-color: var(--accent); }
  button.primary { width: 100%; padding: 10px; border: 0; border-radius: 8px;
                   background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.primary:disabled { opacity: .55; cursor: default; }
  .presets { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .presets .tag { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .preset { text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
            background: #fff; font: inherit; font-size: 12.5px; cursor: pointer; color: #374151; }
  .preset:hover { border-color: var(--accent); background: #f8fbff; }
  .preset b { display: block; font-size: 12px; color: var(--ink); margin-bottom: 1px; }
  .right { padding: 20px 24px; min-height: 480px; }
  .verdict { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
             border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
  .verdict.ok { background: var(--okbg); color: var(--ok); border: 1px solid #a7f3d0; }
  .verdict.block { background: var(--badbg); color: var(--bad); border: 1px solid #fecaca; }
  .verdict.warn { background: var(--warnbg); color: var(--warn); border: 1px solid #fde68a; }
  .verdict .pill { font-weight: 700; }
  .verdict .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  .report h1 { font-size: 20px; margin: 0 0 10px; }
  .report h2 { font-size: 15px; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .report h3 { font-size: 13.5px; margin: 16px 0 6px; color: #374151; }
  .report p, .report li { font-size: 13.5px; }
  .report ul { padding-left: 20px; }
  .report table { border-collapse: collapse; width: 100%; margin: 8px 0 12px; font-size: 12.5px; }
  .report th, .report td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; }
  .report th { background: #f9fafb; font-weight: 600; }
  .report code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px;
                 font: 12px ui-monospace, Consolas, monospace; }
  .report blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line);
                       color: var(--muted); background: #fafafa; }
  .empty { color: var(--muted); font-size: 13px; padding: 28px 4px; }
  .findings { margin-top: 14px; }
  .finding { font-size: 12.5px; padding: 7px 10px; border-radius: 6px; margin-bottom: 6px; }
  .finding.block { background: var(--badbg); color: var(--bad); }
  .finding.warn { background: var(--warnbg); color: var(--warn); }
  .tracebox { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .tracebox summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .trace { margin-top: 8px; font: 11.5px ui-monospace, Consolas, monospace; color: #374151; }
  .trace div { padding: 3px 0; border-bottom: 1px dotted #eee; }
  .hash { color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>VeriBranch <span style="color:var(--muted);font-weight:400">· 可审计</span></h1>
  <div class="sub">152,538 个美国银行网点 · 1994–2025 · 数字全部来自确定性工具，越域直接拒绝</div>
</header>

<div class="wrap">
  <section class="card left">
    <label for="q">问一个问题</label>
    <textarea id="q" placeholder="例如：2010 到 2015 年，储蓄银行的关停率是多少？"></textarea>
    <button class="primary" id="go">运行 Agent</button>
    <div class="presets">
      <div class="tag">试试这些</div>
      {% for title, q in presets %}
      <button class="preset" data-q="{{ q }}"><b>{{ title }}</b>{{ q }}</button>
      {% endfor %}
    </div>
  </section>

  <main class="card right">
    <div id="verdict"></div>
    <div id="report" class="report"><div class="empty">左侧选一个问题，或自己输入。</div></div>
    <div id="findings" class="findings"></div>
    <details class="tracebox" id="tracebox" style="display:none">
      <summary>查看存证轨迹（哈希链）</summary>
      <div id="trace" class="trace"></div>
    </details>
  </main>
</div>

<script>
const q = document.getElementById('q');
const go = document.getElementById('go');
const report = document.getElementById('report');
const verdict = document.getElementById('verdict');
const findings = document.getElementById('findings');
const tracebox = document.getElementById('tracebox');
const traceEl = document.getElementById('trace');

document.querySelectorAll('.preset').forEach(b => {
  b.addEventListener('click', () => { q.value = b.dataset.q; run(); });
});
go.addEventListener('click', run);
const auto = new URLSearchParams(location.search).get('q');
if (auto) { q.value = auto; run(); }
q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(); });

async function run() {
  const question = q.value.trim();
  if (!question) return;
  go.disabled = true; go.textContent = '运行中…';
  verdict.innerHTML = ''; findings.innerHTML = '';
  report.innerHTML = '<div class="empty">正在调用工具…</div>';
  tracebox.style.display = 'none';
  try {
    const r = await fetch('/api/ask', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const d = await r.json();
    if (d.error) { report.innerHTML = '<div class="empty">' + d.error + '</div>'; return; }

    verdict.className = 'verdict ' + d.verdict.tone;
    verdict.innerHTML = '<span class="pill">' + d.verdict.label + '</span>' +
      '<span>' + d.verdict.detail + '</span>' +
      '<span class="meta">' + (d.elapsed_s ?? '—') + 's · run ' + (d.run_id || '') + '</span>';

    report.innerHTML = d.report_html;

    (d.findings || []).forEach(f => {
      if (f.severity === 'block' || f.severity === 'warn') {
        const el = document.createElement('div');
        el.className = 'finding ' + f.severity;
        el.textContent = '[' + f.rule + '] ' + f.message;
        findings.appendChild(el);
      }
    });

    if (d.run_id) {
      const t = await fetch('/api/trace/' + d.run_id).then(x => x.json());
      if (t.entries) {
        tracebox.style.display = 'block';
        traceEl.innerHTML = t.entries.map(e =>
          '<div>' + e.seq + ' · ' + e.kind + ' · ' + e.hash.slice(0, 16) + '…</div>'
        ).join('') + '<div class="hash">verify: ' + (t.verify.ok ? 'ok' : 'broken') +
          ' · head ' + t.verify.head.slice(0, 24) + '…</div>';
      }
    }
  } catch (e) {
    report.innerHTML = '<div class="empty">请求失败：' + e.message + '</div>';
  } finally {
    go.disabled = false; go.textContent = '运行 Agent';
  }
}
</script>
</body>
</html>
